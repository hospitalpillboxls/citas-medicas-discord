<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Citas Médicas</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f8;color:#173f64}
.card{max-width:1000px;margin:35px auto;background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 15px 45px #173f6425}.head{background:linear-gradient(135deg,#073b73,#062653);color:#fff;padding:38px 45px}.head h1{margin:0 0 8px;font-size:36px}.body{padding:35px 45px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}label{font-weight:700;display:block;margin:6px 0 8px}input,select,textarea{width:100%;padding:14px;border:1px solid #d1dbe5;border-radius:10px;font:inherit;color:#173f64;background:#fff}textarea{min-height:120px;resize:vertical}button{border:0;border-radius:10px;padding:15px 20px;background:#0865c7;color:#fff;font-weight:700;cursor:pointer;width:100%;margin-top:5px}.status{text-align:center;margin-top:14px;min-height:20px;font-weight:700}.note{background:#f1f6fb;border-radius:10px;padding:14px;color:#56718a;font-size:14px}.ok{color:#16803c}.err{color:#b42318}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.body{padding:25px}.head{padding:30px 25px}}
</style></head>
<body><main class="card"><header class="head"><h1>SOLICITA TU CITA</h1><div>Selecciona un día y una hora disponible.</div></header>
<section class="body"><form id="form"><div class="grid">
<div><label>Nombre completo</label><input id="nombre" required maxlength="100"></div>
<div><label>Teléfono</label><input id="telefono" required maxlength="30"></div>
<div class="full"><label>Especialidad médica</label><select id="especialidad" required><option value="">Selecciona una especialidad</option><option>Medicina general</option><option>Traumatología</option><option>Cardiología</option><option>Ginecología</option></select></div>
<div><label>Día disponible</label><select id="dia" required><option value="">Cargando días...</option></select></div>
<div><label>Hora disponible</label><select id="hora" required><option value="">Selecciona primero un día</option></select></div>
<div class="full"><label>Motivo de la consulta</label><textarea id="motivo" required maxlength="1500"></textarea></div>
<div class="full"><div class="note">Las horas que ya hayan sido reservadas no aparecerán como disponibles.</div><button id="btn">SOLICITAR CITA</button><div id="status" class="status"></div></div>
</div></form></section></main>
<script>
const dia=document.getElementById('dia'),hora=document.getElementById('hora'),status=document.getElementById('status'),btn=document.getElementById('btn');
async function cargarDias(){const r=await fetch('/.netlify/functions/availability');const j=await r.json();dia.innerHTML='<option value="">Selecciona un día</option>';if(!j.ok){status.textContent=j.error||'No se pudo cargar la disponibilidad';status.className='status err';return}j.days.forEach(x=>dia.add(new Option(x.label,x.date)));} 
async function cargarHoras(){hora.innerHTML='<option>Cargando...</option>';if(!dia.value){hora.innerHTML='<option>Selecciona primero un día</option>';return}const r=await fetch('/.netlify/functions/availability?date='+encodeURIComponent(dia.value));const j=await r.json();hora.innerHTML='';if(!j.ok){hora.add(new Option('No disponible',''));return}j.slots.forEach(x=>hora.add(new Option(x,x)));if(!j.slots.length)hora.add(new Option('No quedan horas disponibles',''))}
dia.addEventListener('change',cargarHoras);
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;status.className='status';status.textContent='Enviando...';try{const body={nombre:nombre.value,telefono:telefono.value,especialidad:especialidad.value,dia:dia.value,hora:hora.value,motivo:motivo.value};const r=await fetch('/.netlify/functions/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'No se pudo reservar');status.className='status ok';status.textContent='✓ Solicitud enviada correctamente.';e.target.reset();await cargarDias();hora.innerHTML='<option>Selecciona primero un día</option>'}catch(err){status.className='status err';status.textContent='Error: '+err.message}finally{btn.disabled=false}});
cargarDias();
</script></body></html>
