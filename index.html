<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solicita tu cita</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#eaf1f7,#f8fafc);color:#173f64}
.card{width:min(1020px,calc(100% - 28px));margin:40px auto;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 18px 55px #0b31552e}
.header{background:linear-gradient(135deg,#073b73,#062653);color:#fff;padding:42px 58px;display:flex;align-items:center;gap:26px}
.medical{width:92px;height:92px;border-radius:50%;background:#ffffff20;display:grid;place-items:center}.cross{position:relative;width:56px;height:56px}.cross:before,.cross:after{content:"";position:absolute;background:#fff;border-radius:7px}.cross:before{width:20px;height:56px;left:18px}.cross:after{width:56px;height:20px;top:18px}
h1{margin:0 0 10px;font-size:42px}.subtitle{font-size:17px;line-height:1.5}
.form{padding:38px 58px 32px}.title{font-size:23px;margin:0 0 7px}.desc{margin:0 0 26px;color:#71849a}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.full{grid-column:1/-1}.field{margin-bottom:2px}
label{display:block;font-size:14px;font-weight:bold;margin-bottom:8px}input,select,textarea{width:100%;padding:16px;border:1px solid #d4dfe9;border-radius:10px;font:inherit;color:#173f64}textarea{min-height:125px;resize:vertical}
button{width:100%;border:0;border-radius:10px;padding:17px;background:linear-gradient(90deg,#0865c7,#0755a9);color:#fff;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.65}.status{text-align:center;margin-top:15px;min-height:20px;font-weight:bold}
.footer{background:#f1f5f9;padding:22px 58px;display:flex;gap:14px;align-items:center}.discord{width:48px;height:48px;border-radius:50%;background:#5865f2;color:#fff;display:grid;place-items:center;font-weight:bold}
.footer b{display:block;margin-bottom:4px}.footer span{color:#71849a;font-size:14px}
@media(max-width:700px){.header{padding:30px 25px}.form{padding:30px 25px}.footer{padding:20px 25px}.grid{grid-template-columns:1fr}.full{grid-column:auto}h1{font-size:30px}}
</style>
</head>
<body>
<main class="card">
<header class="header"><div class="medical"><div class="cross"></div></div><div><h1>SOLICITA TU CITA</h1><div class="subtitle">Completa el formulario y nuestro equipo se pondrá en contacto contigo.</div></div></header>
<form class="form" id="form">
<h2 class="title">Datos de la cita</h2><p class="desc">Indica tus datos y la fecha que prefieres.</p>
<div class="grid">
<div class="field"><label>Nombre completo</label><input name="nombre" maxlength="100" required placeholder="Escribe tu nombre completo"></div>
<div class="field"><label>Teléfono</label><input name="telefono" type="tel" maxlength="30" required placeholder="Número de contacto"></div>
<div class="field full"><label>Especialidad médica</label><select name="especialidad" required><option value="">Selecciona una especialidad</option><option>Medicina general</option><option>Traumatología</option><option>Cardiología</option><option>Ginecología</option><option>Pediatría</option><option>Dermatología</option><option>Odontología</option><option>Otra</option></select></div>
<div class="field"><label>Fecha preferente</label><input name="fecha" type="date" required></div>
<div class="field"><label>Hora preferente</label><input name="hora" type="time" required></div>
<div class="field full"><label>Motivo de la consulta</label><textarea name="motivo" maxlength="1500" required placeholder="Cuéntanos brevemente el motivo de tu consulta..."></textarea></div>
<div class="full"><button id="btn">ENVIAR SOLICITUD</button><div id="status" class="status"></div></div>
</div>
</form>
<footer class="footer"><div class="discord">D</div><div><b>Citas gestionadas a través de Discord</b><span>Nuestro equipo se pondrá en contacto contigo.</span></div></footer>
</main>
<script>
const f=document.getElementById('form'),b=document.getElementById('btn'),s=document.getElementById('status');
f.addEventListener('submit',async e=>{e.preventDefault();b.disabled=true;s.textContent='Enviando solicitud…';s.style.color='#173f64';
try{let r=await fetch('/.netlify/functions/cita',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});let d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||('Error HTTP '+r.status));s.textContent='✓ Solicitud enviada correctamente.';s.style.color='#15803d';f.reset()}catch(e){s.textContent='Error: '+e.message;s.style.color='#b91c1c'}finally{b.disabled=false}});
</script>
</body></html>
