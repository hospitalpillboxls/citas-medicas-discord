<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citas Médicas</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f8;
      color: #17324d;
    }

    .container {
      width: min(1000px, 94%);
      margin: 30px auto;
      background: white;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
      color: #0d496b;
    }

    .subtitulo {
      color: #64748b;
      margin-bottom: 25px;
    }

    .seccion {
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #69c7ca;
    }

    .dias {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .dia {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 10px 15px;
      cursor: pointer;
      background: white;
    }

    .dia:hover {
      background: #eefafa;
    }

    .dia.activo {
      background: #76c9cc;
      color: white;
      border-color: #76c9cc;
    }

    .horarios {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }

    .hora {
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: white;
      cursor: pointer;
      font-size: 15px;
    }

    .hora:hover {
      background: #eefafa;
    }

    .hora.seleccionada {
      background: #76c9cc;
      color: white;
      border-color: #76c9cc;
    }

    .hora.ocupada {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .formulario {
      display: none;
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px solid #e2e8f0;
    }

    .fila {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .campo {
      margin-bottom: 18px;
    }

    .boton {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #83ced0;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .boton:hover {
      background: #68bfc2;
    }

    .boton:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .mensaje {
      margin-top: 15px;
      padding: 14px;
      border-radius: 10px;
      display: none;
    }

    .mensaje.error {
      display: block;
      background: #fee2e2;
      color: #b91c1c;
    }

    .mensaje.exito {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .cargando {
      color: #64748b;
      margin-top: 15px;
    }

    .seleccion {
      padding: 15px;
      background: #eefafa;
      border-radius: 10px;
      margin-top: 20px;
      display: none;
    }

    @media (max-width: 650px) {
      .container {
        padding: 20px;
      }

      .fila {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Reservar cita médica</h1>

  <div class="subtitulo">
    Selecciona una fecha y un horario disponible.
  </div>

  <div class="seccion">
    <label for="fecha">Fecha</label>
    <input type="date" id="fecha">
    <div id="cargando" class="cargando"></div>
  </div>

  <div class="seccion">
    <label>Horarios disponibles</label>
    <div id="horarios" class="horarios"></div>
  </div>

  <div id="seleccion" class="seleccion"></div>

  <div id="formulario" class="formulario">

    <h2>Datos del paciente</h2>

    <div class="fila">

      <div class="campo">
        <label for="nombre">Nombre</label>
        <input
          type="text"
          id="nombre"
          placeholder="Nombre completo"
          autocomplete="name"
        >
      </div>

      <div class="campo">
        <label for="telefono">Teléfono</label>
        <input
          type="tel"
          id="telefono"
          placeholder="Teléfono"
          autocomplete="tel"
        >
      </div>

    </div>

    <div class="campo">
      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        placeholder="correo@ejemplo.com"
        autocomplete="email"
      >
    </div>

    <button id="reservar" class="boton">
      Reservar cita
    </button>

    <div id="mensaje" class="mensaje"></div>

  </div>

</div>

<script>

  const fechaInput = document.getElementById("fecha");
  const horariosDiv = document.getElementById("horarios");
  const formulario = document.getElementById("formulario");
  const seleccionDiv = document.getElementById("seleccion");
  const mensajeDiv = document.getElementById("mensaje");
  const cargandoDiv = document.getElementById("cargando");
  const reservarBtn = document.getElementById("reservar");

  let fechaSeleccionada = null;
  let horaSeleccionada = null;

  function mostrarError(texto) {
    mensajeDiv.className = "mensaje error";
    mensajeDiv.textContent = texto;
    mensajeDiv.style.display = "block";
  }

  function mostrarExito(texto) {
    mensajeDiv.className = "mensaje exito";
    mensajeDiv.textContent = texto;
    mensajeDiv.style.display = "block";
  }

  function limpiarMensaje() {
    mensajeDiv.style.display = "none";
    mensajeDiv.textContent = "";
  }

  function fechaHoy() {
    const ahora = new Date();

    const y = ahora.getFullYear();
    const m = String(ahora.getMonth() + 1).padStart(2, "0");
    const d = String(ahora.getDate()).padStart(2, "0");

    return `${y}-${m}-${d}`;
  }

  fechaInput.min = fechaHoy();

  async function cargarHorarios() {

    const fecha = fechaInput.value;

    if (!fecha) {
      horariosDiv.innerHTML = "";
      formulario.style.display = "none";
      seleccionDiv.style.display = "none";
      return;
    }

    fechaSeleccionada = fecha;
    horaSeleccionada = null;

    formulario.style.display = "none";
    seleccionDiv.style.display = "none";
    limpiarMensaje();

    horariosDiv.innerHTML = "";
    cargandoDiv.textContent = "Cargando horarios...";

    try {

    const respuesta = await fetch(
  `/.netlify/functions/availability?date=${encodeURIComponent(fecha)}`
);

console.log("Respuesta availability:", respuesta.status);

const texto = await respuesta.text();

console.log("Texto recibido:", texto);

let datos;

try {
  datos = JSON.parse(texto);
} catch (e) {
  console.error("Respuesta recibida:", texto);

  throw new Error(
    "El servidor no devolvió JSON. Comprueba que la función availability.js esté desplegada en Netlify."
  );
}

if (!respuesta.ok || !datos.ok) {
  throw new Error(
    datos.error || "No se pudieron cargar los horarios."
  );
      }

      datos.slots.forEach(slot => {

        const boton = document.createElement("button");

        boton.type = "button";
        boton.className = "hora";
        boton.textContent = slot.time;

        if (slot.available === false) {

          boton.classList.add("ocupada");
          boton.disabled = true;
          boton.title = "Horario ocupado";

        } else {

          boton.addEventListener("click", () => {

            document
              .querySelectorAll(".hora")
              .forEach(b => b.classList.remove("seleccionada"));

            boton.classList.add("seleccionada");

            horaSeleccionada = slot.time;

            seleccionDiv.innerHTML =
              `<strong>Fecha:</strong> ${fechaSeleccionada}
               &nbsp; | &nbsp;
               <strong>Hora:</strong> ${horaSeleccionada}`;

            seleccionDiv.style.display = "block";
            formulario.style.display = "block";

            limpiarMensaje();

            formulario.scrollIntoView({
              behavior: "smooth",
              block: "start"
            });

          });

        }

        horariosDiv.appendChild(boton);
      });

    } catch (error) {

      cargandoDiv.textContent = "";

      mostrarError(error.message);

    }
  }

  fechaInput.addEventListener("change", cargarHorarios);


  reservarBtn.addEventListener("click", async () => {

    limpiarMensaje();

    if (!fechaSeleccionada || !horaSeleccionada) {
      mostrarError("Selecciona primero una fecha y un horario.");
      return;
    }

    const nombre =
      document.getElementById("nombre").value.trim();

    const telefono =
      document.getElementById("telefono").value.trim();

    const email =
      document.getElementById("email").value.trim();

    if (!nombre) {
      mostrarError("Introduce el nombre.");
      return;
    }

    if (!telefono) {
      mostrarError("Introduce el teléfono.");
      return;
    }

    if (!email) {
      mostrarError("Introduce el correo electrónico.");
      return;
    }

    if (!email.includes("@")) {
      mostrarError("Introduce un correo electrónico válido.");
      return;
    }

    reservarBtn.disabled = true;
    reservarBtn.textContent = "Reservando...";

    try {

      const respuesta = await fetch(
        "/.netlify/functions/book",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            date: fechaSeleccionada,
            time: horaSeleccionada,
            name: nombre,
            email: email,
            phone: telefono
          })
        }
      );

      const texto = await respuesta.text();

      let datos;

      try {
        datos = JSON.parse(texto);
      } catch (e) {
        console.error("Respuesta recibida:", texto);

        throw new Error(
          "El servidor devolvió una respuesta incorrecta. Comprueba que book.js esté desplegado en Netlify."
        );
      }

      if (!respuesta.ok || !datos.ok) {
        throw new Error(
          datos.error || "No se pudo reservar la cita."
        );
      }

      mostrarExito(
        `Cita reservada correctamente para el ${fechaSeleccionada} a las ${horaSeleccionada}.`
      );

      document.getElementById("nombre").value = "";
      document.getElementById("telefono").value = "";
      document.getElementById("email").value = "";

      horaSeleccionada = null;

      await cargarHorarios();

    } catch (error) {

      mostrarError(error.message);

    } finally {

      reservarBtn.disabled = false;
      reservarBtn.textContent = "Reservar cita";

    }

  });

</script>

</body>
</html>
