<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Citas</title><style>body{font-family:Arial;background:#eef3f8;margin:0}.card{max-width:900px;margin:30px auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px #0002}.h{background:#073b73;color:#fff;padding:30px}.f{padding:25px}.g{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}label{font-weight:bold;display:block;margin:8px 0}input,select,textarea{width:100%;padding:12px;border:1px solid #ccd;border-radius:8px}button{width:100%;padding:14px;background:#0865c7;color:#fff;border:0;border-radius:8px;font-weight:bold;margin-top:10px}@media(max-width:700px){.g{grid-template-columns:1fr}}</style></head><body><div class='card'><div class='h'><h1>Solicita tu cita</h1></div><div class='f'><div class='g'><div><label>Nombre</label><input id='n'></div><div><label>Teléfono</label><input id='t'></div><div class='full'><label>Especialidad</label><select id='e'><option>Medicina general</option><option>Traumatología</option><option>Cardiología</option><option>Ginecología</option></select></div><div><label>Día disponible</label><select id='dia'></select></div><div><label>Hora disponible</label><select id='hora'></select></div><div class='full'><label>Motivo</label><textarea id='m'></textarea></div><div class='full'><button id='b'>Reservar cita</button><div id='s'></div></div></div></div></div><script>const disponibilidad={'Lunes':['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30'],'Martes':['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30'],'Miércoles':['16:00','16:30','17:00','17:30','18:00','18:30','19:00','19:30'],'Jueves':['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30'],'Viernes':['09:00','09:30','10:00','10:30','11:00','11:30','12:00','12:30','13:00','13:30']};const d=document.getElementById('dia'),h=document.getElementById('hora');Object.keys(disponibilidad).forEach(k=>d.add(new Option(k,k)));function cargar(){h.innerHTML='';disponibilidad[d.value].forEach(x=>h.add(new Option(x,x)));}d.onchange=cargar;cargar();document.getElementById('b').onclick=async()=>{const s=document.getElementById('s');s.textContent='Enviando...';const body={nombre:n.value,telefono:t.value,especialidad:e.value,dia:d.value,hora:h.value,motivo:m.value};const r=await fetch('/.netlify/functions/cita',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();s.textContent=j.ok?'Cita enviada a Discord':'Error: '+(j.error||'desconocido');};</script></body></html>
